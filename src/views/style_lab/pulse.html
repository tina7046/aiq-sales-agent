<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pulse</title>
  <link rel="stylesheet" href="/styles/index.css">
  <link rel="stylesheet" href="/styles/home.css">
  <style>
    body {
      display: grid;
      place-items: center;
      min-height: 100vh;
      margin: 0;
      background: #f3f3f3;
    }
  </style>
</head>
<body>
  <div data-sh-feed-state="running">
    <button type="button" class="seller-home__feed-item-status" aria-label="Running">
      <span class="seller-home__feed-item-status-glyph seller-home__feed-item-status-glyph--spinner" aria-hidden="true">
        <span class="seller-home__feed-status-pulse">
          <span class="seller-home__feed-status-pulse-dot"></span>
          <span class="seller-home__feed-status-pulse-ring"></span>
        </span>
      </span>
    </button>
  </div>
</body>
</html>
